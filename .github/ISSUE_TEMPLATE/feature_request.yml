name: Feature request
description: Suggest an idea or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case or pain point, not just the solution.
      placeholder: When I ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like this project to do. Sketches and example flows welcome.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or tools you have tried or thought about.
    validations:
      required: false
  - type: textarea
    id: docs-impact
    attributes:
      label: Docs impact
      description: Which doc surfaces will this touch (specific files/sections)? "none" must be justified.
    validations:
      required: true
